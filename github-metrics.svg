<svg width="800" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="320" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  
  <!-- Header -->
  <g transform="translate(32, 38)">
    <circle cx="10" cy="10" r="8" fill="#00F5D4"/>
    <text x="28" y="16" fill="#F0F6FC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">
      Full-Stack Production Metrics (Public + 27 Private Client Repos)
    </text>
    <text x="28" y="36" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="12">
      Verified data synchronized across all enterprise platforms, GIS registries, and AI agent pipelines
    </text>
  </g>

  <!-- Left Stats Column -->
  <g transform="translate(32, 105)">
    <!-- Stat 1 -->
    <rect width="160" height="80" rx="10" fill="#161B22" stroke="#21262D"/>
    <text x="20" y="36" fill="#00F5D4" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800">1,138+</text>
    <text x="20" y="60" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">TOTAL CONTRIBUTIONS</text>

    <!-- Stat 2 -->
    <rect x="180" width="160" height="80" rx="10" fill="#161B22" stroke="#21262D"/>
    <text x="200" y="36" fill="#22D3EE" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800">36</text>
    <text x="200" y="60" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">TOTAL REPOSITORIES</text>

    <!-- Stat 3 -->
    <rect y="95" width="160" height="80" rx="10" fill="#161B22" stroke="#21262D"/>
    <text x="20" y="131" fill="#A78BFA" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800">33,000+</text>
    <text x="20" y="155" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">VECTOR EMBEDDINGS</text>

    <!-- Stat 4 -->
    <rect x="180" y="95" width="160" height="80" rx="10" fill="#161B22" stroke="#21262D"/>
    <text x="200" y="131" fill="#38BDF8" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800">5</text>
    <text x="200" y="155" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">PRODUCTION PLATFORMS</text>
  </g>

  <!-- Divider -->
  <line x1="390" y1="105" x2="390" y2="280" stroke="#21262D" stroke-width="1.5"/>

  <!-- Right Stack Distribution Column -->
  <g transform="translate(420, 105)">
    <text x="0" y="16" fill="#F0F6FC" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">
      Multi-Repo Stack Distribution
    </text>

    <!-- Language 1: JavaScript & React -->
    <g transform="translate(0, 35)">
      <text x="0" y="12" fill="#E6EDF3" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">React &amp; JavaScript (Frontends, Dashboards, MapLibre)</text>
      <text x="340" y="12" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">54.1%</text>
      <rect y="20" width="340" height="8" rx="4" fill="#21262D"/>
      <rect y="20" width="184" height="8" rx="4" fill="#F7DF1E"/>
    </g>

    <!-- Language 2: Python / Django / AI -->
    <g transform="translate(0, 80)">
      <text x="0" y="12" fill="#E6EDF3" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Python (Django, GeoDjango, Celery, PydanticAI)</text>
      <text x="340" y="12" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">2.97M Bytes</text>
      <rect y="20" width="340" height="8" rx="4" fill="#21262D"/>
      <rect y="20" width="145" height="8" rx="4" fill="#38BDF8"/>
    </g>

    <!-- Language 3: UI Templates, Styling & Mobile -->
    <g transform="translate(0, 125)">
      <text x="0" y="12" fill="#E6EDF3" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">TypeScript, Tailwind CSS &amp; Mobile (React Native / Expo)</text>
      <text x="340" y="12" fill="#8B949E" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">Enterprise UI</text>
      <rect y="20" width="340" height="8" rx="4" fill="#21262D"/>
      <rect y="20" width="110" height="8" rx="4" fill="#3178C6"/>
    </g>
  </g>
</svg>